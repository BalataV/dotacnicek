<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Účet — Dotačníček</title>
  <link rel="icon" href="../img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#FFD60A; --card:#FFFFFF; --ink:#15233B; --muted:#7A839A; --accent:#1D5FD8; --bad:#E23B2E; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Nunito', system-ui, sans-serif;
      min-height: 100vh; padding: 40px 18px 56px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .wrap { width: 100%; max-width: 460px; }
    .card {
      background: var(--card); border: 3px solid var(--ink); border-radius: 20px;
      box-shadow: 5px 5px 0 var(--ink); padding: 30px 26px; text-align: center;
    }
    .emoji { font-size: 44px; line-height: 1; display: block; margin-bottom: 12px; }
    h1 { font-family: 'Baloo 2', cursive; font-size: 26px; letter-spacing: -0.5px; line-height: 1.2; }
    p { font-weight: 600; line-height: 1.6; margin-top: 10px; }
    .muted { color: var(--muted); font-size: 14px; }
    label { display: block; text-align: left; font-weight: 800; font-size: 14px; margin: 16px 0 6px; }
    input {
      width: 100%; font-family: inherit; font-size: 16px; font-weight: 700; color: var(--ink);
      background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 12px 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; margin-top: 18px; font-family: 'Baloo 2', cursive; font-size: 17px;
      background: var(--accent); color: #fff; border: 3px solid var(--ink); border-radius: 14px;
      padding: 13px 18px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink);
    }
    button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    button[disabled] { opacity: .55; cursor: default; transform: none; }
    .err { color: var(--bad); font-weight: 800; font-size: 14px; margin-top: 12px; }
    .stores { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin-top: 20px; }
    .stores img { height: 40px; width: auto; display: block; }
    .home { display: inline-block; margin-top: 18px; color: var(--accent); font-weight: 800; font-size: 14px; }
    .foot { text-align: center; font-size: 13px; font-weight: 700; opacity: .65; margin-top: 18px; }
    .foot a { color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card"><p class="muted" id="boot">…</p></div>
    <p class="foot">Dotačníček · <a href="https://dotacnicek.cz">dotacnicek.cz</a></p>
  </div>

  <script>
    /*
     * Tahle stránka NENÍ webová verze aplikace — Dotačníček běží výhradně jako
     * mobilní appka. Adresa /app/ je Site URL v Supabase, takže sem míří odkazy
     * z e-mailů (potvrzení registrace, obnova hesla). Stránka umí právě tyhle
     * dvě věci a nic jiného; kdo sem přijde bez platného odkazu, jde na web.
     */
    var SB_URL = 'https://fbhwsrclexkhpbfiwprw.supabase.co';
    var SB_KEY = 'sb_publishable_HeHvUgksqdXQV2kfqTBVHg_UGkY1ib4';
    var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.balata.dotacnik';
    var APPSTORE_URL = 'https://apps.apple.com/app/id6794624597';
    var LANDING = 'https://dotacnicek.cz/';
    var MIN_PW = 6;

    var CS = (navigator.language || 'cs').toLowerCase().indexOf('cs') === 0;
    function t(cs, en) { return CS ? cs : en; }

    var card = document.getElementById('card');
    var params = new URLSearchParams(window.location.search);
    var tokenHash = params.get('token_hash');
    var type = params.get('type');
    var hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
    var linkError = hash.get('error_description') || hash.get('error');

    // Adresu hned uklidíme, ať se jednorázový token neválí v historii prohlížeče.
    if (tokenHash || linkError) {
      history.replaceState(null, '', window.location.pathname);
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
      });
    }

    function storesHtml() {
      return '<div class="stores">' +
        '<a href="' + APPSTORE_URL + '"><img src="../img/appstore-cs.svg" alt="App Store" /></a>' +
        '<a href="' + PLAY_URL + '"><img src="../img/googleplay-cs.png" alt="Google Play" /></a>' +
        '</div>';
    }

    function showDone(emoji, title, text) {
      card.innerHTML =
        '<span class="emoji">' + emoji + '</span>' +
        '<h1>' + esc(title) + '</h1>' +
        '<p>' + esc(text) + '</p>' +
        storesHtml();
    }

    function showError(detail) {
      card.innerHTML =
        '<span class="emoji">🙈</span>' +
        '<h1>' + esc(t('Odkaz už neplatí', 'This link has expired')) + '</h1>' +
        '<p>' + esc(t(
          'Odkazy z e-mailu platí jen chvíli a dají se použít jednou. Požádej o nový přímo v aplikaci.',
          'Email links are short-lived and single-use. Request a new one from the app.'
        )) + '</p>' +
        (detail ? '<p class="err">' + esc(detail) + '</p>' : '') +
        '<a class="home" href="' + LANDING + '">' + esc(t('‹ Zpět na dotacnicek.cz', '‹ Back to dotacnicek.cz')) + '</a>';
    }

    // Supabase Auth přes REST – žádná knihovna, žádné CDN, žádné ukládání session.
    function api(path, opts) {
      opts = opts || {};
      var headers = { apikey: SB_KEY, 'Content-Type': 'application/json' };
      if (opts.token) headers.Authorization = 'Bearer ' + opts.token;
      return fetch(SB_URL + '/auth/v1' + path, {
        method: opts.method || 'POST',
        headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      }).then(function (res) {
        return res.text().then(function (raw) {
          var data = {};
          try { data = raw ? JSON.parse(raw) : {}; } catch (e) { /* prázdná odpověď je v pořádku */ }
          if (!res.ok) throw new Error(data.msg || data.error_description || data.message || ('HTTP ' + res.status));
          return data;
        });
      });
    }

    function renderRecoveryForm(accessToken) {
      card.innerHTML =
        '<span class="emoji">🔑</span>' +
        '<h1>' + esc(t('Nastav si nové heslo', 'Set a new password')) + '</h1>' +
        '<p class="muted">' + esc(t('Aspoň 6 znaků. Pak se s ním přihlásíš v aplikaci.', 'At least 6 characters. Then sign in with it in the app.')) + '</p>' +
        '<label for="pw">' + esc(t('Nové heslo', 'New password')) + '</label>' +
        '<input id="pw" type="password" autocomplete="new-password" />' +
        '<label for="pw2">' + esc(t('Heslo znovu', 'Repeat password')) + '</label>' +
        '<input id="pw2" type="password" autocomplete="new-password" />' +
        '<button id="save">' + esc(t('Uložit heslo', 'Save password')) + '</button>' +
        '<p class="err" id="msg" hidden></p>';

      var pw = document.getElementById('pw');
      var pw2 = document.getElementById('pw2');
      var btn = document.getElementById('save');
      var msg = document.getElementById('msg');

      function fail(text) {
        msg.textContent = text;
        msg.hidden = false;
        btn.disabled = false;
        btn.textContent = t('Uložit heslo', 'Save password');
      }

      function submit() {
        msg.hidden = true;
        if (pw.value.length < MIN_PW) {
          return fail(t('Heslo musí mít aspoň 6 znaků', 'Password must be at least 6 characters'));
        }
        if (pw.value !== pw2.value) {
          return fail(t('Hesla se neshodují', 'Passwords do not match'));
        }
        btn.disabled = true;
        btn.textContent = t('Ukládám…', 'Saving…');
        api('/user', { method: 'PUT', token: accessToken, body: { password: pw.value } })
          .then(function () {
            // Session, kterou jsme si kvůli změně hesla vyrobili, rovnou zahodíme.
            return api('/logout', { token: accessToken }).catch(function () {});
          })
          .then(function () {
            showDone('✅', t('Heslo je změněné', 'Password changed'),
              t('Otevři Dotačníčka a přihlas se novým heslem.', 'Open Dotačníček and sign in with your new password.'));
          })
          .catch(function (e) { fail(e.message); });
      }

      btn.addEventListener('click', submit);
      pw2.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') pw2.focus(); });
      pw.focus();
    }

    (function main() {
      if (linkError) return showError(linkError);

      // Bez platného odkazu tu není co dělat – appka je jen pro mobil.
      if (!tokenHash || (type !== 'signup' && type !== 'recovery')) {
        return window.location.replace(LANDING);
      }

      card.innerHTML = '<p class="muted">' + esc(t('Ověřuju odkaz…', 'Checking your link…')) + '</p>';

      api('/verify', { body: { type: type, token_hash: tokenHash } })
        .then(function (data) {
          if (type === 'signup') {
            // Potvrzení e-mailu session nepotřebuje – rovnou ji zneplatníme.
            if (data.access_token) api('/logout', { token: data.access_token }).catch(function () {});
            return showDone('🎉', t('E-mail je potvrzený', 'Email confirmed'),
              t('Hotovo. Otevři Dotačníčka a přihlas se.', 'All set. Open Dotačníček and sign in.'));
          }
          if (!data.access_token) throw new Error(t('Odkaz je neplatný', 'Invalid link'));
          renderRecoveryForm(data.access_token);
        })
        .catch(function (e) { showError(e.message); });
    })();
  </script>
</body>
</html>
